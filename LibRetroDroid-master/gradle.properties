android.enableJetifier=true
android.useAndroidX=true

# Packaging this app needs more heap than Gradle's default. :app:packageDebug died of an
# OutOfMemoryError on two separate machines (2026-08-24 and 2026-09-10), each time leaving
# a ~600 MB heap dump behind; the native libraries and the 36 MB of cores make the
# packaging step unusually memory-hungry. 4 GB clears it with room to spare.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:-HeapDumpOnOutOfMemoryError
