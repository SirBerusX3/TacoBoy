apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing credentials, kept out of git (see keystore.properties and .gitignore).
// Deliberately optional: a clone without the keystore still builds and still produces a
// working debug APK, and only `assembleRelease` is affected. A hard failure here would mean
// nobody but this machine could build the project at all, which is a poor trade for a
// GPL-3 project that has to be able to hand out its source.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    compileSdkVersion 34
    defaultConfig {
        // The app's permanent identity on Android, set 2026-09-10, replacing the
        // 'com.android.gl2jni' placeholder inherited from the LibretroDroid sample.
        // Changing it again after anyone else has installed is not a rename -- Android
        // treats it as a different app entirely, so the old install stays put, cannot be
        // updated, and its filesDir (save states, BIOS, presets, prefs) is unreachable
        // from the new one. Fixed now, while the only install is a personal test device.
        applicationId 'com.tacoboy'
        // Version fields. These are what the About tab reports and what a bug report
        // identifies the build by, so two people running "TacoBoy" should never be unable
        // to say which one they have. Bump before sharing a build.
        versionCode 3
        versionName '0.2.1'
        minSdkVersion 21
        targetSdkVersion 33

        // Only arm64. The emulator cores are prebuilt binaries and only exist here for
        // arm64-v8a, so on any other ABI the app installs and then has nothing to run --
        // 6 MB of liblibretrodroid and libzstd for architectures that cannot emulate
        // anything. Declaring it means such a device declines the install instead of
        // accepting a broken one.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // v1+v2 are what actually gate installation; v3 additionally records the
                // signing lineage, which is the only mechanism for rotating to a new key
                // later without every existing install refusing the update. Cheap to have
                // and impossible to add retroactively to builds already handed out.
                enableV3Signing true
            }
        }
    }

    // BuildConfig is off by default from AGP 8 onward. It is on because the
    // RetroAchievements user agent has to carry the real versionName: RA identifies
    // clients by user agent, and one that lies about its version makes any report from
    // the field harder to place. RetroAchievementsClient is an object with no Context,
    // so BuildConfig.VERSION_NAME is the way it can see the version at all.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // R8 stays off. Nothing here is size-constrained by Java code -- the APK is
            // almost entirely native libraries -- and shrinking would put reflection-driven
            // paths (JNI callbacks, the vendored zstd/xz codecs) at risk for no real gain.
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                          'proguard-rules.pro'
            // Unsigned unless the keystore is present. An unsigned APK cannot be installed
            // by anyone, so a release build that silently produced one was the single thing
            // standing between this project and being shareable.
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            // Signed with the same release key on purpose. Android refuses to update an
            // installed app with one signed by a different key, so mixed signing means every
            // swap between debug and release is an uninstall -- which takes the ROM folder
            // grants, BIOS files and save states with it. Matching them makes the two
            // interchangeable on a device.
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace = "com.android.libretrodroid"
}

dependencies {
    api project(path: ':libretrodroid')
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "androidx.appcompat:appcompat:1.5.1"

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "io.coil-kt:coil:2.6.0"

    // CHD (PS1 disc image) per-hunk decompression. Zstandard (cdzs codec, 170 of the
    // user's 209 real PS1 files) needs a real native decoder, not a "pure Java" one --
    // io.airlift:aircompressor looked right on paper (pure Java, no java.lang.foreign)
    // but crashed on-device with NoSuchFieldError on sun.misc.Unsafe.ARRAY_BYTE_BASE_OFFSET,
    // a field desktop OpenJDK's Unsafe has that Android's ART Unsafe shim doesn't -- a gap
    // the JVM unit tests couldn't see since they run on a real desktop JVM. zstd-jni ships
    // an actual Android .aar with prebuilt natives per ABI instead.
    implementation "org.tukaani:xz:1.10"
    implementation "com.github.luben:zstd-jni:1.5.7-3@aar"

    // Pure-JVM unit tests for deterministic parsing logic (CHD container, ISO9660, RA
    // hashing) — fast to run against real captured bytes, no device/adb round trip needed.
    // zstd-jni needs the plain jar (not @aar) here -- these tests run on a desktop JVM,
    // and the plain jar bundles natives for desktop platforms too.
    testImplementation "junit:junit:4.13.2"
    testImplementation "com.github.luben:zstd-jni:1.5.7-3"
    // Android's org.json is a compile-only stub (throws on every call under a plain JVM
    // unit test) -- the real reference implementation for testing RetroAchievementsClient's
    // JSON parsing without needing Robolectric/instrumentation.
    testImplementation "org.json:json:20250517"
}

repositories {
    mavenCentral()
}

